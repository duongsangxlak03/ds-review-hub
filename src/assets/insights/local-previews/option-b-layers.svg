      .body { font-family: "Inter", Arial, sans-serif; font-weight: 500; fill: #111111; }
      .micro { font-family: "Inter", Arial, sans-serif; font-weight: 800; fill: #111111; letter-spacing: 3px; }
      .card { stroke: #111111; stroke-width: 3; }
      .line { fill: none; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    ]]></style>
  </defs>
